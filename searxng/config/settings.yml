# Read the documentation before extending the defaults:
# https://docs.searxng.org/admin/settings/

use_default_settings: true

ui:
  default_theme: simple

general:
  instance_name: "Search123"
  privacypolicy_url: "https://cheesy-studios.tawk.help/article/hieronder-onze-uitgebreide-privacyverklaring"

server:
  # Secret is supplied by the container environment (SEARXNG_SECRET).
  # Verify support against the selected upstream SearXNG image before deployment.
  image_proxy: true
  public_instance: false

valkey:
  url: valkey://valkey:6379/0

brand:
  issue_url: "https://github.com/Kaasplank1234/Search123/issues"
  new_issue_url: "https://github.com/Kaasplank1234/Search123/issues/new/choose"
  docs_url: "https://github.com/Kaasplank1234/Search123"
  wiki_url: "https://github.com/Kaasplank1234/Search123/wiki"
  custom:
    links:
      Search123 website: "https://kaasplank1234.github.io/Search123/"
      Cheesy Studios: "https://www.cheesy-studios.22web.org/homepagina"
      GitHub project: "https://github.com/Kaasplank1234/Search123"
