<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search123 — A privacy-focused metasearch engine. Fast, clean, and without tracking." />
    <title>Search123 · Privacy-focused search engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070a10;
            --bg-soft: #0d1219;
            --card: #111823;
            --card-hover: #161f2e;
            --border: #1c2533;
            --border-hover: rgba(48, 80, 255, 0.35);
            --text: #eef1f6;
            --text-dim: #8b95a8;
            --text-soft: #5c6778;
            --accent: #3050ff;
            --accent-light: #7ab8ff;
            --accent-soft: rgba(48, 80, 255, 0.1);
            --radius: 18px;
            --radius-sm: 12px;
            --radius-full: 9999px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 50% -30%, rgba(48, 80, 255, 0.18), transparent 55%),
                radial-gradient(ellipse at 90% 110%, rgba(48, 80, 255, 0.06), transparent 45%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            padding: 40px 20px 60px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            animation: fadeUp 0.8s ease-out both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== HERO ===== */
        .hero {
            text-align: center;
            margin-bottom: 56px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            background: var(--accent-soft);
            border: 1px solid rgba(48, 80, 255, 0.18);
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-light);
            margin-bottom: 24px;
        }

        .hero-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-light);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        .hero-title {
            font-size: clamp(2.8rem, 8vw, 4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            background: linear-gradient(135deg, #ffffff 0%, #7ab8ff 60%, #3050ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
        }

        .hero-subtitle {
            font-size: 1.05rem;
            color: var(--text-dim);
            font-weight: 400;
            max-width: 460px;
            margin: 0 auto;
            line-height: 1.7;
            letter-spacing: 0.01em;
        }

        /* ===== SECTION LABEL ===== */
        .section-label {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-soft);
            margin-bottom: 16px;
            padding-left: 4px;
        }

        /* ===== CARD ===== */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 26px;
            margin-bottom: 14px;
            transition: all var(--transition);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(48, 80, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: var(--accent-soft);
            border: 1px solid rgba(48, 80, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        .card:hover .card-icon {
            background: rgba(48, 80, 255, 0.16);
            border-color: rgba(48, 80, 255, 0.25);
            transform: scale(1.05);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.88rem;
            color: var(--text-dim);
            margin-bottom: 18px;
            line-height: 1.65;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.88rem;
            transition: gap var(--transition), color var(--transition);
        }

        .card-link:hover {
            gap: 12px;
            color: #a8d0ff;
        }

        .card-link .arrow {
            transition: transform var(--transition);
            font-size: 1rem;
        }

        .card-link:hover .arrow {
            transform: translateX(3px);
        }

        /* ===== DIVIDER ===== */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin: 48px 0;
        }

        /* ===== PRIVACY NOTE ===== */
        .privacy-note {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 22px 24px;
            margin-bottom: 48px;
            text-align: left;
        }

        .privacy-note .note-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .privacy-note .note-text {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.7;
        }

        .privacy-note .note-text a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid rgba(48, 80, 255, 0.3);
            transition: border-color var(--transition);
        }

        .privacy-note .note-text a:hover {
            border-color: var(--accent-light);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding-top: 8px;
        }

        .made-with-love {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dim);
            transition: all var(--transition);
            margin-bottom: 24px;
        }

        .made-with-love:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            color: var(--text);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .made-with-love .heart {
            color: #ef4444;
            animation: heartbeat 1.6s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.18);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.12);
            }
            60% {
                transform: scale(1);
            }
        }

        .footer-meta {
            font-size: 0.78rem;
            color: var(--text-soft);
            letter-spacing: 0.02em;
        }

        .footer-meta a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 500;
            transition: opacity var(--transition);
        }

        .footer-meta a:hover {
            opacity: 0.8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            body {
                padding: 28px 16px 48px;
            }

            .hero {
                margin-bottom: 40px;
            }

            .card {
                padding: 22px 20px;
            }

            .card-icon {
                width: 38px;
                height: 38px;
                font-size: 18px;
            }

            .privacy-note {
                padding: 18px 20px;
            }

            .made-with-love {
                padding: 10px 20px;
                font-size: 0.8rem;
            }
        }

        /* ===== ACCESSIBILITY ===== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        a:focus-visible {
            outline: 2px solid var(--accent-light);
            outline-offset: 3px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- HERO -->
        <section class="hero">
            <div class="hero-badge">
                <span class="dot"></span>
                Privacy-first metasearch
            </div>
            <h1 class="hero-title">Search123</h1>
            <p class="hero-subtitle">
                A clean, privacy-focused search experience. No tracking. No profiling. Just results.
            </p>
        </section>

        <!-- QUICK LINKS -->
        <p class="section-label">Explore</p>

        <a href="https://github.com/Kaasplank1234/Search123" target="_blank" rel="noopener" class="card" style="display:block; text-decoration:none;">
            <div class="card-header">
                <div class="card-icon">📦</div>
                <h2 class="card-title">GitHub Repository</h2>
            </div>
            <p class="card-desc">
                Full documentation, architecture details, deployment guidance, and privacy information.
            </p>
            <span class="card-link">
                View on GitHub
                <span class="arrow">→</span>
            </span>
        </a>

        <a href="https://www.cheesy-studios.22web.org/homepagina" target="_blank" rel="noopener" class="card" style="display:block; text-decoration:none;">
            <div class="card-header">
                <div class="card-icon">🌐</div>
                <h2 class="card-title">Cheesy Studios</h2>
            </div>
            <p class="card-desc">
                Visit the official Cheesy Studios website for more projects, services, and updates.
            </p>
            <span class="card-link">
                Go to website
                <span class="arrow">→</span>
            </span>
        </a>

        <a href="https://www.cheesy-studios.22web.org/neem-contact-met-ons-op-faq" target="_blank" rel="noopener" class="card" style="display:block; text-decoration:none;">
            <div class="card-header">
                <div class="card-icon">✉️</div>
                <h2 class="card-title">Contact & FAQ</h2>
            </div>
            <p class="card-desc">
                Questions, ideas, or collaboration? Get in touch or check the frequently asked questions.
            </p>
            <span class="card-link">
                Contact us
                <span class="arrow">→</span>
            </span>
        </a>

        <div class="divider"></div>

        <!-- PRIVACY NOTE -->
        <div class="privacy-note">
            <div class="note-title">🔒 Privacy</div>
            <p class="note-text">
                Search123 is built with privacy in mind. We do not track, profile, or sell your data.
                For full details on how we handle information, please refer to the
                <a href="https://github.com/Kaasplank1234/Search123" target="_blank" rel="noopener">documentation on GitHub</a>.
            </p>
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <a href="https://www.cheesy-studios.22web.org/homepagina" target="_blank" rel="noopener" class="made-with-love">
                Made with <span class="heart">❤</span> by Cheesy-Studios
            </a>
            <p class="footer-meta">
                © 2026 Cheesy Studios · <a href="https://search123.dpdns.org/" target="_blank" rel="noopener">Search123</a>
            </p>
        </footer>

    </div>
</body>
</html>
