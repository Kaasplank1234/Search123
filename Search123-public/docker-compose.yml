services:
  searxng:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080/tcp"
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
      - ./logo/searxng.png:/usr/local/searxng/searx/static/themes/simple/img/searxng.png:ro
      - ./custom-templates/base.html:/usr/local/searxng/searx/templates/simple/base.html:ro
    environment:
      - SEARXNG_BASE_URL=https://search.example.org/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:?Set SEARXNG_SECRET_KEY in .env}
      - FORCE_OWNERSHIP=true
    depends_on:
      - valkey

  valkey:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:8.0-alpine
    volumes:
      - valkey-data:/data
    command: valkey-server --save 30 1 --loglevel warning

volumes:
  valkey-data:
